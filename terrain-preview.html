<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SMOKESTACK terrain preview</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1d1a16; font: 12px monospace; color: #eee; }
      #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
      #hud { position: fixed; top: 6px; left: 8px; background: rgba(0,0,0,.55); padding: 4px 8px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud">
      drag = pan, wheel = zoom |
      month <input id="month" type="range" min="1" max="12" value="6" /> <span id="mv">6</span> |
      <label><input id="oil" type="checkbox" checked /> oil</label> |
      seed <input id="seed" type="number" value="1" style="width:60px" />
    </div>
    <script type="module" src="/src/render/terrainPreview.ts"></script>
  </body>
</html>
