worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Hashed build output: safe to cache for a year.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # The entry point must always be revalidated so new builds are picked up.
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # JEV decision proxy (compose network only). The key stays in that service.
        location /api/ {
            # Docker's resolver + a variable upstream: resolved per request, so nginx starts
            # without the proxy (502 on /api/ only) and follows a recreated container.
            # With a variable, the URI is passed unchanged (/api/health, /api/decide).
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $ai_upstream http://ai-proxy:8787;
            proxy_pass $ai_upstream;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 5s;
        }

        # SPA fallback: unknown paths serve the game shell.
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }
    }
}
